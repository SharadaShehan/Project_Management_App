name: Deploy Infrastructure

on:
  push:
    branches:
      - main
      - mod
    paths:
      - 'infrastructure/**'
      - 'lambda/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches:
      - main
      - mod
    paths:
      - 'infrastructure/**'
      - 'lambda/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: 1.6.0
  NODE_VERSION: 20

jobs:
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check
        working-directory: ./infrastructure
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ./infrastructure
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ./infrastructure
        run: terraform validate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: lambda/package-lock.json

      - name: Install Lambda Dependencies
        working-directory: ./lambda
        run: npm ci

      - name: Lint Lambda Code (if configured)
        working-directory: ./lambda
        run: npm run lint || echo "Linting not configured"
        continue-on-error: true

  build:
    name: Build Lambda Functions
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: lambda/package-lock.json

      - name: Install dependencies
        working-directory: ./lambda
        run: npm ci

      - name: Build Lambda Layer
        working-directory: ./lambda
        run: npm run build:layer

      - name: Build Lambda Functions
        working-directory: ./lambda
        run: npm run build:functions

      - name: Upload Lambda artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lambda-artifacts
          path: |
            lambda/layers/dependencies.zip
            lambda/dist/lambda.zip
          retention-days: 7

  terraform-plan:
    name: Terraform Plan
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Download Lambda artifacts
        uses: actions/download-artifact@v4
        with:
          name: lambda-artifacts
          path: lambda/

      - name: Upload Lambda artifacts to S3
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="project-mgmt-lambda-deploy-${ACCOUNT_ID}"
          
          # Create bucket if it doesn't exist
          aws s3 mb s3://${BUCKET} --region ${{ env.AWS_REGION }} || true
          
          # Upload artifacts
          aws s3 cp lambda/layers/dependencies.zip s3://${BUCKET}/lambda-layer.zip
          aws s3 cp lambda/dist/lambda.zip s3://${BUCKET}/lambda-functions.zip

      - name: Terraform Init
        working-directory: ./infrastructure
        run: terraform init

      - name: Terraform Plan
        working-directory: ./infrastructure
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      - name: Comment PR with Plan
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infrastructure/tfplan', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan\n\`\`\`terraform\n${plan}\n\`\`\``
            });

  deploy:
    name: Deploy to AWS
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: ${{ github.event.inputs.environment || 'development' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Download Lambda artifacts
        uses: actions/download-artifact@v4
        with:
          name: lambda-artifacts
          path: lambda/

      - name: Upload Lambda artifacts to S3
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="project-mgmt-lambda-deploy-${ACCOUNT_ID}"
          
          # Create bucket if it doesn't exist
          aws s3 mb s3://${BUCKET} --region ${{ env.AWS_REGION }} || true
          
          # Upload artifacts
          aws s3 cp lambda/layers/dependencies.zip s3://${BUCKET}/lambda-layer.zip
          aws s3 cp lambda/dist/lambda.zip s3://${BUCKET}/lambda-functions.zip
          
          echo "Lambda artifacts uploaded to s3://${BUCKET}"

      - name: Terraform Init
        working-directory: ./infrastructure
        run: terraform init

      - name: Terraform Apply
        working-directory: ./infrastructure
        run: |
          terraform apply -auto-approve -var="gemini_api_key=${{ secrets.GEMINI_API_KEY }}"

      - name: Get Terraform Outputs
        id: terraform-outputs
        working-directory: ./infrastructure
        run: |
          echo "appsync_endpoint=$(terraform output -raw appsync_endpoint)" >> $GITHUB_OUTPUT
          echo "cognito_user_pool_id=$(terraform output -raw cognito_user_pool_id)" >> $GITHUB_OUTPUT
          echo "cognito_client_id=$(terraform output -raw cognito_client_id)" >> $GITHUB_OUTPUT

      - name: Deployment Summary
        run: |
          echo "## 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Resources Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- **AppSync Endpoint:** ${{ steps.terraform-outputs.outputs.appsync_endpoint }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Cognito User Pool:** ${{ steps.terraform-outputs.outputs.cognito_user_pool_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Cognito Client ID:** ${{ steps.terraform-outputs.outputs.cognito_client_id }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Update frontend configuration with these values" >> $GITHUB_STEP_SUMMARY
          echo "2. Set Gemini API key in Parameter Store" >> $GITHUB_STEP_SUMMARY
          echo "3. Deploy frontend application" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please check the logs for details." >> $GITHUB_STEP_SUMMARY
